name: XLSM merge check
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out trusted base code, not the PR's executable files or merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/xlsm_merge/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_xlsm*.py'
      - run: python tools/xlsm_merge/ci.py
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlsm-merge-report
          path: xlsm-artifacts/
